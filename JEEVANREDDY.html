<!DOCTYPE html>
<html>
<head>
    <title>QUANTUM CODON</title>

    <style>
        body{
            margin:0;
            font-family:Arial;
            background:#f0f2f5;
        }

        .header{
            background:#1877f2;
            color:RED;
            padding:15px;
            font-size:30px;
            font-weight:bold;
        }

        .main{
            display:flex;
            justify-content:space-around;
            align-items:center;
            height:80vh;
        }

        .left{
            width:40%;
        }

        .left h1{
            color:#1877f2;
            font-size:50px;
        }

        .left p{
            font-size:24px;
        }

        .login-box{
            background:BLUE;
            padding:20px;
            width:300px;
            border-radius:10px;
            box-shadow:0 0 10px gray;
        }

        .login-box input{
            width:100%;
            padding:12px;
            margin-top:10px;
            border:1px solid #ccc;
            border-radius:5px;
        }

        .login-box button{
            width:100%;
            padding:12px;
            margin-top:15px;
            background:#1877f2;
            color:white;
            border:none;
            border-radius:5px;
            font-size:18px;
        }

        .create{
            background:WHITE !important;
        }
    </style>
</head>

<body>

    <div class="header">
        MyCompany
    </div>

    <div class="main">

        <div class="left">
            <h1>MyCompany</h1>
            <p>Connect with people and grow your business online.</p>
        </div>

        <div class="login-box">
            <input type="text" placeholder="Email or Phone">
            <input type="password" placeholder="Password">

            <button>Log In</button>

            <hr>

            <button class="create">Create New Account</button>
        </div>

    </div>

</body>
</html>
